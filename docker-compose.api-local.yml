services:
  api:
    image: node:20-alpine
    container_name: product_ops_api_local
    working_dir: /app
    env_file:
      - .env.api
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy

